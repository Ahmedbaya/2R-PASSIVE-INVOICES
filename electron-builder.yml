appId: com.facturespassives.manager
productName: 2R FACTURES PASSIVES
directories:
  buildResources: build
files:
  - '!**/.vscode/*'
  - '!src/*'
  - '!electron.vite.config.{js,ts,mjs,cjs}'
  - '!{.eslintcache,eslint.config.mjs,.prettierignore,.prettierrc.yaml,dev-app-update.yml,CHANGELOG.md,README.md}'
  - '!{.env,.env.*,.npmrc,pnpm-lock.yaml}'
  - '!{tsconfig.json,tsconfig.node.json,tsconfig.web.json}'
  - '!scripts/*'
asarUnpack:
  - resources/**
win:
  icon: build/icon.ico
  target:
    - target: nsis
      arch:
        - x64
  executableName: 2R-FACTURES-PASSIVES
nsis:
  artifactName: 2R-FACTURES-PASSIVES-${version}-setup.${ext}
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  shortcutName: ${productName}
  uninstallDisplayName: ${productName}
  createDesktopShortcut: always
  createStartMenuShortcut: true
  installerIcon: icon.ico
  uninstallerIcon: icon.ico
  installerSidebar: installerSidebar.bmp
  uninstallerSidebar: installerSidebar.bmp
  installerHeader: installerHeader.bmp